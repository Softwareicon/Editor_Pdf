name: Unzip project
on:
  push:
    paths: ['.github/workflows/unzip.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip into repo root
        run: |
          unzip -q pdf-master-pro-phase2a.zip -d /tmp/x
          # GITHUB_TOKEN cannot write workflow files, so .github is added separately
          rm -rf /tmp/x/pdf-master-pro/.github
          cp -a /tmp/x/pdf-master-pro/. .
          git rm -q pdf-master-pro-phase2a.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract pdf-master-pro phase 2a into repository root"
          git push
