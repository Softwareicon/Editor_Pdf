name: Unzip project
on:
  push:
    paths: ['.github/workflows/unzip.yml']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract update into repo root
        run: |
          unzip -o -q pdf-master-pro-update-3.zip -x '.github/*' -d .
          git rm -q pdf-master-pro-update-3.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add PDF tools page, form filling and links"
          git push
