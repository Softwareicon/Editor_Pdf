name: Apply fix
on:
  push:
    paths: ['.github/workflows/unzip.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch editor.js
        run: |
          python3 - <<'PY'
          p = 'frontend/assets/js/editor.js'
          s = open(p).read()
          old = '  if (n === state.current && $("page-input").value === String(n)) return;'
          new = ('  // Same page: resync the box only if the user is not typing a page number into it right now.\n'
                 '  if (n === state.current && ($("page-input").value === String(n) || document.activeElement === $("page-input"))) return;')
          assert s.count(old) == 1
          open(p, 'w').write(s.replace(old, new))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Do not overwrite the page number box while the user is typing in it"
          git push
