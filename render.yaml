# Render Blueprint: free web service (Docker) + free PostgreSQL.
services:
  - type: web
    name: pdf-master-pro
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: sh render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: PDFMASTER_ENVIRONMENT
        value: production
      - key: PDFMASTER_SECRET_KEY
        generateValue: true
      - key: PDFMASTER_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: pdf-master-pro-db
          property: connectionString

databases:
  - name: pdf-master-pro-db
    plan: free
    databaseName: pdfmaster
    user: pdfmaster
